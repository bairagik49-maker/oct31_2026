name: myworkflow_oct31

on:
  push:
  #  workflow_dispatch:
jobs:
  myjobs1:
    runs-on: ubuntu-latest

    steps:
      - name: mystep1
        run: | 
            whoami
            cat /etc/os-release
            docker --version
            docker compose version
            systemctl status docker
            ls -al
      - name: mystep2- checkout the source code 
        uses: actions/checkout@v4
      - name: mystep3- check if the source code is available in workspace or not 
        run: ls -al

      - name: mystep4- Build docker image
        run: |
           docker image build -t karan6260k/myimage_oct31_26:t${{ github.run_number }} -f Dockerfile .
      - name: mystep5- check if the image is build success
        run: docker images     
      - name: mystep6- Docker login
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }} 
      - name: Push image to Docker Hub
        run: |
           docker image push karan6260k/myimage_oct31_26:t${{ github.run_number }}  
                
